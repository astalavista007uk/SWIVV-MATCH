<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Illustration d'un témoignage amoureux noté cinq étoiles">
  <defs>
    <linearGradient id="trbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6f4f5"/>
      <stop offset="0.5" stop-color="#fdeef1"/>
      <stop offset="1" stop-color="#e6f4f5"/>
    </linearGradient>
    <g id="tr-sparkle">
      <path d="M0-14 C2-4 4-2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4-2 -2-4 0-14Z"/>
    </g>
    <g id="tr-star">
      <path d="M0-20 L5.9-6.2 20-6.2 8.5 2.4 12.4 16.2 0 8 -12.4 16.2 -8.5 2.4 -20-6.2 -5.9-6.2Z"/>
    </g>
  </defs>
  <rect width="1200" height="320" fill="url(#trbg)"/>

  <!-- floating mini hearts -->
  <g fill="#ffb3c1">
    <path d="M120 220c-18-11-30-22-30-38 0-12 9-21 21-21 8 0 14 4 17 10 4-6 10-10 17-10 12 0 21 9 21 21 0 16-12 27-30 38l-8 5-8-5z"/>
    <path d="M1080 220c-18-11-30-22-30-38 0-12 9-21 21-21 8 0 14 4 17 10 4-6 10-10 17-10 12 0 21 9 21 21 0 16-12 27-30 38l-8 5-8-5z"/>
    <path d="M250 100c-11-7-18-13-18-23 0-7 6-13 13-13 4 0 8 3 10 6 2-3 6-6 10-6 7 0 13 6 13 13 0 10-7 16-18 23l-5 3-5-3z"/>
    <path d="M950 100c-11-7-18-13-18-23 0-7 6-13 13-13 4 0 8 3 10 6 2-3 6-6 10-6 7 0 13 6 13 13 0 10-7 16-18 23l-5 3-5-3z"/>
  </g>
  <g fill="#ff6b8a">
    <use href="#tr-sparkle" transform="translate(300 160) scale(0.6)" opacity="0.7"/>
    <use href="#tr-sparkle" transform="translate(900 160) scale(0.6)" opacity="0.7"/>
  </g>
  <g fill="#007782" opacity="0.45">
    <use href="#tr-sparkle" transform="translate(420 70) scale(0.5)"/>
    <use href="#tr-sparkle" transform="translate(780 70) scale(0.5)"/>
  </g>

  <!-- love speech bubble -->
  <g>
    <rect x="490" y="28" width="220" height="140" rx="36" fill="#ff6b8a"/>
    <path d="M575 168l25 32 25-32z" fill="#ff6b8a"/>
    <path d="M600 128c-26-17-45-33-45-57 0-17 13-30 30-30 11 0 20 6 25 14 5-8 14-14 25-14 17 0 30 13 30 30 0 24-19 40-45 57l-10 6-10-6z" fill="#fff"/>
    <path d="M624 92c6 4 9 10 9 17" fill="none" stroke="#ff6b8a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 5-star rating bar -->
  <g>
    <rect x="380" y="212" width="440" height="72" rx="30" fill="#ffffff" stroke="#1f2a44" stroke-width="10"/>
    <g fill="#f5b800">
      <use href="#tr-star" transform="translate(450 248)"/>
      <use href="#tr-star" transform="translate(515 248)"/>
      <use href="#tr-star" transform="translate(580 248)"/>
      <use href="#tr-star" transform="translate(645 248)"/>
      <use href="#tr-star" transform="translate(710 248)"/>
    </g>
    <!-- cursor clicking the 5th star -->
    <g transform="translate(758 236) rotate(12)">
      <path d="M0 0l44 12-18 8-6 18z" fill="#1f2a44"/>
      <rect x="20" y="30" width="12" height="30" rx="4" fill="#1f2a44" transform="rotate(-18 26 45)"/>
    </g>
  </g>
</svg>
